    <div class="logo">SkyLine Travels</div>
    <nav>
        <ul>
            <li><a href="index.html">Home</a></li>

<section class="page-banner">
    <h1>Contact Us</h1>
</section>

<section class="contact-section">
    <div class="contact-container">

        <div class="contact-info">
            <h2>Get In Touch</h2>
            <p><i class="fas fa-map-marker-alt"></i> Chennai, Tamil Nadu, India</p>
            <p><i class="fas fa-phone"></i> +91 98765 43210</p>
            <p><i class="fas fa-envelope"></i> info@skylinetravels.com</p>
        </div>

        <div class="contact-form">
            <h2>Send Message</h2>
            <form>
                <input type="text" placeholder="Your Name" required>
                <input type="email" placeholder="Your Email" required>
                <input type="tel" placeholder="Your Phone">
                <textarea placeholder="Your Message" rows="5"></textarea>
                <button type="submit" class="btn-primary">Send Message</button>
            </form>
        </div>

    </div>
</section>

<section class="map-section">
    <iframe 
        src="https://www.google.com/maps/embed?pb=!1m18!1m12!1m3!1d3916.284237481437!2d77.5946!3d12.9716!2m3!1f0!2f0!3f0!3m2!"
        width="100%" 
        height="400" 
        style="border:0;" 
        allowfullscreen="" 
        loading="lazy">
    </iframe>
</section>
