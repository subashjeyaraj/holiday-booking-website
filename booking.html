<html lang="en">
<head>
<meta charset="UTF-8">

<title>Book Now | SkyLine Corporate Travels</title>

<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="style.css">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">

</head>
<body>

<header>
    <div class="logo">SkyLine Travels</div>
    <nav>
        <ul>
            <li><a href="index.html">Home</a></li>
            <li><a href="packages.html">Packages</a></li>
            <li><a href="international.html">International</a></li>
            <li><a href="domestic.html">Domestic</a></li>
            <li><a href="about.html">About</a></li>
            <li><a href="contact.html">Contact</a></li>
            <li><a href="booking.html" class="btn-nav active">Book Now</a></li>
        </ul>
    </nav>
</header>

<section class="page-banner">
    <h1>Book Your Dream Trip</h1>
</section>

<section class="booking-section">
    <div class="booking-container">

        <h2>Travel Booking Form</h2>

        <form id="bookingForm">

            <input type="text" id="name" placeholder="Full Name" required>
            <input type="email" id="email" placeholder="Email Address" required>
            <input type="tel" id="phone" placeholder="Phone Number" required>

            <select id="package" required>
                <option value="">Select Package</option>
                <option>Luxury Dubai Escape</option>
                <option>Switzerland Dream Tour</option>
                <option>Maldives Water Villa</option>
                <option>Singapore Explorer</option>
                <option>Thailand Fun Tour</option>
                <option>Kashmir Paradise</option>
                <option>Goa Beach Retreat</option>
                <option>Kerala Backwater Tour</option>
            </select>

            <label>Travel Date</label>
            <input type="date" id="date" required>

            <label>Number of Adults</label>
            <input type="number" id="adults" min="1" required>

            <label>Number of Children</label>
            <input type="number" id="children" min="0">

            <textarea id="message" rows="4" placeholder="Additional Requests"></textarea>

            <button type="submit" class="btn-primary">Confirm Booking</button>

        </form>

        <div id="successMessage" class="success-message">
            🎉 Booking Submitted Successfully! Our team will contact you soon.
        </div>

    </div>
</section>

<footer>
    <p>© 2026 SkyLine Corporate Travels | All Rights Reserved</p>
</footer>

<script src="script.js"></script>

</body>
</html>
